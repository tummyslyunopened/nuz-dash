<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuz-Dash Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d03b3b'/%3E%3Crect x='2' y='14' width='28' height='4' fill='%230c0a12'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230c0a12'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --page:#0c0a12; --surface:#16121f; --surface2:#1f1930; --text:#f4f1fb; --text2:#c9c3dc;
    --muted:#8d86a3; --border:rgba(196,181,253,.14); --accent:#8b5cf6; --critical:#d03b3b; --good:#0ca30c;
  }
  * { box-sizing:border-box }
  body {
    margin:0; padding:20px; font:14px/1.45 system-ui,'Segoe UI',sans-serif; color:var(--text);
    background:radial-gradient(1000px 500px at 85% -10%, rgba(124,58,237,.16), transparent 60%), var(--page);
  }
  h1 { font-size:22px; margin:0 0 4px }
  h1 .tag { font-size:11px; color:var(--critical); border:1px solid var(--critical); border-radius:6px; padding:2px 7px; vertical-align:middle; letter-spacing:.06em }
  .sub { color:var(--muted); margin-bottom:20px; font-size:12.5px }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:26px 0 10px }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
  .grow { flex:1; min-width:0 }
  .name { font-weight:650; font-size:15px }
  .meta { color:var(--muted); font-size:12px }
  table { width:100%; border-collapse:collapse; margin-top:10px }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:4px 8px; border-bottom:1px solid var(--border) }
  td { padding:6px 8px; border-bottom:1px solid rgba(196,181,253,.07); font-size:13px; vertical-align:middle }
  tr:last-child td { border-bottom:none }
  button {
    font:inherit; color:var(--text); background:var(--surface2); border:1px solid var(--border);
    border-radius:7px; padding:4px 10px; cursor:pointer; font-size:12px;
  }
  button:hover { background:#292140 }
  button.danger { color:var(--critical) }
  button.primary { background:var(--accent); border-color:transparent }
  code { background:var(--surface2); padding:1px 6px; border-radius:5px; font-size:11px; word-break:break-all }
  .live { color:var(--good); font-weight:700; font-size:11px }
  pre { background:#0f0c18; border:1px solid var(--border); border-radius:8px; padding:12px; overflow:auto; font-size:11.5px; max-height:420px; white-space:pre-wrap }
  .empty { color:var(--muted); padding:14px; text-align:center }
  #toast { position:fixed; bottom:16px; right:16px; background:var(--surface2); border:1px solid var(--accent); border-radius:8px; padding:8px 14px; display:none }
</style>
</head>
<body>
<h1>Nuz-Dash <span class="tag">ADMIN</span></h1>
<p class="sub">Local: bound to 127.0.0.1. Cloud: mounted at /admin behind basic auth (ADMIN_TOKEN). Deletions are immediate and permanent.</p>

<h2>Public tunnel</h2>
<div id="tunnel" class="card"><p class="empty">Loading…</p></div>

<h2>Lobbies</h2>
<div id="lobbies"><p class="empty">Loading…</p></div>

<h2>Bug reports</h2>
<div id="bugs"><p class="empty">Loading…</p></div>

<div id="toast"></div>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const fmtSize = (n) => n > 1e6 ? (n/1e6).toFixed(1) + ' MB' : Math.round(n/1e3) + ' KB'
let mainPort = 4517

function toast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.style.display = 'block'
  setTimeout(() => { t.style.display = 'none' }, 3000)
}

// NOTE: all API paths are RELATIVE ("api/...") so this page works both on the
// local admin port (/) and mounted under /admin/ on a cloud deployment.
async function call(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  })
  if (!res.ok) throw new Error((await res.json()).error || res.status)
  return res.json()
}

let publicUrl = null
// On the local admin port, member links point at the main app port; when
// mounted under /admin on the main app, the current origin already is the app.
const onMainApp = location.pathname.startsWith('/admin')
const origin = () => publicUrl || (onMainApp ? location.origin : `http://${location.hostname}:${mainPort}`)
const memberUrl = (token) => `${origin()}/m/${token}`
const inviteUrl = (token) => `${origin()}/join/${token}`

async function loadTunnel() {
  const t = await call('GET', 'api/tunnel')
  publicUrl = t.url
  const el = document.getElementById('tunnel')
  const statusColor = t.status === 'running' ? 'var(--good)' : t.status.startsWith('error') ? 'var(--critical)' : 'var(--muted)'
  const named = t.mode === 'named'
  el.innerHTML = `
    <div class="row">
      <div class="grow">
        <div class="name">Status: <span style="color:${statusColor}">${esc(t.status)}</span></div>
        ${t.url
          ? `<div class="meta">Public URL: <code>${esc(t.url)}</code> <button onclick="copyText('${esc(t.url)}')">copy</button></div>`
          : `<div class="meta">No public URL — copied lobby links fall back to local addresses. (On cloud hosts the platform provides the public URL; the tunnel is unnecessary.)</div>`}
        <div class="meta">binary: <code>${esc(t.binary)}</code>${t.startedAt ? ' · started ' + new Date(t.startedAt).toLocaleString() : ''}</div>
        <div class="meta"><label><input type="checkbox" ${t.autoTunnel ? 'checked' : ''} onchange="autoTunnel(this.checked)"> auto-start tunnel when the server boots</label></div>
      </div>
      ${t.status === 'running' || t.status === 'starting'
        ? `<button class="danger" onclick="tunnelCmd('stop')">Stop tunnel</button>`
        : `<button class="primary" onclick="tunnelCmd('start')">Start tunnel</button>`}
    </div>
    <div class="meta" style="margin-top:12px; border-top:1px solid var(--border); padding-top:10px">
      <b>Mode:</b>
      <label><input type="radio" name="tmode" value="quick" ${!named ? 'checked' : ''}> quick (random trycloudflare.com URL)</label>
      <label><input type="radio" name="tmode" value="named" ${named ? 'checked' : ''}> named (your Cloudflare domain)</label>
    </div>
    <div class="meta" style="margin-top:6px">
      tunnel name <input id="tname" value="${esc(t.name)}" style="width:130px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:3px 8px">
      hostname <input id="thost" value="${esc(t.hostname)}" placeholder="app.example.com" style="width:190px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:3px 8px">
      <button onclick="saveTunnelConfig()">Save config</button>
      ${named && !t.hasCert ? `<button class="primary" onclick="tunnelLogin()">1. Login to Cloudflare</button>` : ''}
      ${named && t.hasCert ? `<button class="primary" onclick="tunnelSetup()">Create tunnel &amp; route DNS</button>` : ''}
      ${named ? `<span>cert: ${t.hasCert ? '✓' : '✗ (login required)'}</span>` : ''}
    </div>
    <div class="meta" id="tunnel-setup-out"></div>
    ${t.log.length ? `<pre style="margin-top:10px; max-height:140px">${esc(t.log.join('\n'))}</pre>` : ''}`
}

async function saveTunnelConfig() {
  const mode = document.querySelector('input[name="tmode"]:checked').value
  await call('POST', 'api/tunnel/config', {
    mode,
    name: document.getElementById('tname').value,
    hostname: document.getElementById('thost').value
  })
  toast('Tunnel config saved — restart the tunnel to apply')
  loadTunnel()
}

async function tunnelLogin() {
  const r = await call('POST', 'api/tunnel/login')
  toast(r.message)
  setTimeout(loadTunnel, 8000)
}

async function tunnelSetup() {
  try {
    const r = await call('POST', 'api/tunnel/setup')
    document.getElementById('tunnel-setup-out').innerHTML = `<pre>${esc(r.output.join('\n'))}</pre>`
    toast('Tunnel created and DNS routed — start the tunnel')
  } catch (e) {
    toast('Setup failed: ' + e.message)
  }
  loadTunnel()
}

async function tunnelCmd(cmd) {
  await call('POST', 'api/tunnel/' + cmd)
  toast(cmd === 'start' ? 'Tunnel starting — URL appears in a few seconds' : 'Tunnel stopped')
  setTimeout(() => { loadTunnel(); loadLobbies() }, 1500)
  setTimeout(() => { loadTunnel(); loadLobbies() }, 6000)
}

async function autoTunnel(enabled) {
  await call('POST', 'api/tunnel/autostart', { enabled })
  toast(enabled ? 'Tunnel will auto-start with the server' : 'Auto-start disabled')
}

async function loadLobbies() {
  const data = await call('GET', 'api/overview')
  mainPort = data.mainPort
  const el = document.getElementById('lobbies')
  if (!data.lobbies.length) { el.innerHTML = '<p class="empty">No lobbies.</p>'; return }
  el.innerHTML = data.lobbies.map((l) => `
    <div class="card">
      <div class="row">
        <div class="grow">
          <div class="name">${esc(l.name)}</div>
          <div class="meta">
            created ${new Date(l.createdAt).toLocaleString()} ·
            ${l.members.length} runner(s) ·
            ROM: ${l.rom ? esc(l.rom.name) + ' (' + fmtSize(l.rom.size) + ')' : 'none'}
          </div>
          <div class="meta">invite: <code>${esc(inviteUrl(l.inviteToken))}</code>
            <button onclick="copyText('${esc(inviteUrl(l.inviteToken))}')">copy</button>
          </div>
        </div>
        <button class="danger" onclick="deleteLobby('${l.id}', '${esc(l.name)}')">Delete lobby</button>
      </div>
      ${l.members.length ? `
      <table>
        <tr><th>Runner</th><th>Status</th><th>Attempts</th><th>Personal link</th><th></th></tr>
        ${l.members.map((m) => `
          <tr>
            <td>${esc(m.name)} ${m.live ? '<span class="live">● LIVE</span>' : ''}</td>
            <td class="meta">${m.active
              ? `#${m.active.attemptNumber} ${esc(m.active.gameName)} · 🏅${m.active.badges} · ●${m.active.alive} · ☠${m.active.deaths}`
              : 'no active attempt'}</td>
            <td>${m.attempts}</td>
            <td><button onclick="copyText('${esc(memberUrl(m.token))}')">copy link</button></td>
            <td style="text-align:right; white-space:nowrap">
              <button onclick="regen('${m.id}', '${esc(m.name)}')">new link</button>
              <button class="danger" onclick="deleteMember('${m.id}', '${esc(m.name)}')">remove</button>
            </td>
          </tr>`).join('')}
      </table>` : '<p class="empty">No members.</p>'}
    </div>`).join('')
}

async function loadBugs() {
  const bugs = await call('GET', 'api/bugs')
  const el = document.getElementById('bugs')
  if (!bugs.length) { el.innerHTML = '<p class="empty">No bug reports.</p>'; return }
  el.innerHTML = bugs.map((b) => `
    <div class="card">
      <div class="row">
        <div class="grow">
          <div class="name">${esc(b.description) || '<i>(no description)</i>'}</div>
          <div class="meta">${esc(b.reporter)} @ ${esc(b.lobby)} · ${new Date(b.serverTime).toLocaleString()} · ${b.errors} captured log line(s)</div>
        </div>
        <button onclick="toggleBug('${esc(b.file)}')">details</button>
        <button class="danger" onclick="deleteBug('${esc(b.file)}')">delete</button>
      </div>
      <pre id="bug-${esc(b.file)}" style="display:none; margin-top:10px"></pre>
    </div>`).join('')
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'))
}

async function deleteLobby(id, name) {
  if (!confirm(`Delete lobby "${name}" with ALL its runners, attempts, saves and ROM? This cannot be undone.`)) return
  await call('DELETE', 'api/lobbies/' + id)
  toast('Lobby deleted')
  loadLobbies()
}

async function deleteMember(id, name) {
  if (!confirm(`Remove runner "${name}" and all their attempts/saves? This cannot be undone.`)) return
  await call('DELETE', 'api/members/' + id)
  toast('Runner removed')
  loadLobbies()
}

async function regen(id, name) {
  if (!confirm(`Generate a new secret link for "${name}"? Their old link stops working.`)) return
  const r = await call('POST', `api/members/${id}/regenerate`)
  await navigator.clipboard.writeText(memberUrl(r.memberToken))
  toast(`New link for ${name} copied to clipboard`)
  loadLobbies()
}

async function toggleBug(file) {
  const pre = document.getElementById('bug-' + file)
  if (pre.style.display === 'none') {
    const report = await call('GET', 'api/bugs/' + file)
    pre.textContent = JSON.stringify(report, null, 2)
    pre.style.display = 'block'
  } else {
    pre.style.display = 'none'
  }
}

async function deleteBug(file) {
  if (!confirm('Delete this bug report?')) return
  await call('DELETE', 'api/bugs/' + file)
  toast('Report deleted')
  loadBugs()
}

async function boot() {
  try { await loadTunnel() } catch (e) { document.getElementById('tunnel').innerHTML = `<p class="empty">${esc(e.message)}</p>` }
  loadLobbies().catch((e) => { document.getElementById('lobbies').innerHTML = `<p class="empty">${esc(e.message)}</p>` })
  loadBugs().catch((e) => { document.getElementById('bugs').innerHTML = `<p class="empty">${esc(e.message)}</p>` })
}
boot()
setInterval(() => { loadTunnel().then(loadLobbies).catch(() => {}) }, 30000)
</script>
</body>
</html>
